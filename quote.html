<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>今日の名言・セリフ</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding-top: 80px;
      background-color: #f4f3f8;
      color: #333;
    }
    .card {
      background: #ffffff;
      max-width: 420px;
      margin: 0 auto;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(143, 130, 169, 0.1);
    }
    h1 {
      font-size: 16px;
      color: #a39bb8;
      margin-bottom: 24px;
      letter-spacing: 2px;
    }
    #quote-box {
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 30px;
    }
    #quote {
      font-size: 20px;
      font-weight: bold;
      color: #3d3748;
      line-height: 1.6;
      margin-bottom: 12px;
    }
    #author {
      font-size: 14px;
      color: #8d859b;
    }
    button {
      background-color: #e09f9f;
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 15px;
      border-radius: 20px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #c98888;
    }

    /* ふわっと浮き出るアニメーション設定（分かりやすく調整版） */
    .fade-in {
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>TODAY'S WORDS</h1>
    
    <div id="quote-box">
      <div id="quote">ボタンを押すとセリフが出ます</div>
      <div id="author"></div>
    </div>

    <button onclick="generateQuote()">言葉を受け取る</button>
  </div>

  <script>
    const quotes = [
      {
        text: "生きろ",
        author: "アシタカ"
      },
      {
        text: "人生に失敗がないと、人生を失敗する。",
        author: "斎藤茂太"
      },
      {
        text: "昨日の自分より、ほんの少し前へ。",
        author: "メッセージ"
      },
      {
        text: "お疲れ様です。少し温かいお茶でも淹れましょうか。",
        author: "執事"
      }
    ];

    function generateQuote() {
      const randomIndex = Math.floor(Math.random() * quotes.length);
      const selected = quotes[randomIndex];

      const quoteEl = document.getElementById("quote");
      const authorEl = document.getElementById("author");

      // アニメーションを一旦リセット
      quoteEl.classList.remove("fade-in");
      authorEl.classList.remove("fade-in");

      // テキストを差し替え
      quoteEl.innerText = `「${selected.text}」`;
      authorEl.innerText = `— ${selected.author}`;

      // ブラウザに再描画させてからアニメーションを再付与
      void quoteEl.offsetWidth;
      quoteEl.classList.add("fade-in");
      authorEl.classList.add("fade-in");
    }
  </script>

</body>
</html>
